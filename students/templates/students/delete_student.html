<!DOCTYPE html>
<html>
<head>
    <title>Delete Student</title>

    <style>
        body {
            font-family: Arial;
            background: #f3eaff;
            text-align: center;
            padding: 100px;
        }

        .container {
            background: white;
            padding: 40px;
            width: 400px;
            margin: auto;
            border-radius: 12px;
        }

        button {
            background: red;
            color: white;
            padding: 12px 25px;
            border: none;
            cursor: pointer;
        }

        a {
            margin-left: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Delete Student</h2>

    <p>Are you sure you want to delete
        <b>{{ student.student_name }}</b>?
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">Yes, Delete</button>

        <a href="{% url 'student_list' %}">Cancel</a>
    </form>

</div>

</body>
</html>
